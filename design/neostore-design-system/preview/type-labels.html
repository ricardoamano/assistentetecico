<!doctype html>
<!-- @dsCard group="Type" name="Type · labels" subtitle="Manrope (local font file)" viewport="760x280" --><html><head><meta charset="utf-8"><title>Type — labels & data</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: baseline; gap: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--neo-cloud); }
  .row:last-child { border-bottom: 0; padding-bottom: 0; }
  .label { width: 120px; flex-shrink: 0; }
  .label .n { font-family: var(--font-mono); font-size: 11px; color: var(--neo-steel); }
  .label .s { font-size: 10px; color: var(--neo-fog); margin-top: 2px; }
</style>
</head><body>
<div class="card">
  <div class="eyebrow">Labels · specs · technical data</div>
  <div class="stack">
    <div class="row">
      <div class="label"><div class="n">Eyebrow</div><div class="s">12 · 600 · uppercase · 0.16em · teal</div></div>
      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.16em;color:#1F6E78">Solução técnica</div>
    </div>
    <div class="row">
      <div class="label"><div class="n">Button</div><div class="s">14 · 600</div></div>
      <div style="display:inline-flex;padding:10px 18px;background:#1F6E78;color:#fff;border-radius:6px;font-size:14px;font-weight:600;letter-spacing:-0.005em">Solicitar orçamento</div>
    </div>
    <div class="row">
      <div class="label"><div class="n">Caption</div><div class="s">11 · 500 · fog</div></div>
      <div style="font-size:11px;font-weight:500;color:var(--neo-fog)">Painel LED · pitch 2.6mm · 4K @ 60fps</div>
    </div>
    <div class="row">
      <div class="label"><div class="n">Mono / data</div><div class="s">JetBrains Mono · 13</div></div>
      <div style="font-family:var(--font-mono);font-size:13px;color:var(--neo-ink)">CH-014 · -3.0 dBu · XLR-F · 48V</div>
    </div>
    <div class="row">
      <div class="label"><div class="n">Stat</div><div class="s">48 · 800 · -0.03em</div></div>
      <div style="font-size:48px;font-weight:800;letter-spacing:-0.03em;line-height:1;color:#1F6E78">18<span style="font-size:24px;font-weight:600;color:var(--neo-steel);margin-left:4px">anos</span></div>
    </div>
  </div>
</div>
</body></html>
