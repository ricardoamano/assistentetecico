<!doctype html>
<!-- @dsCard group="Spacing" name="Radius & shadow" subtitle="Corner radii + restrained shadow set" viewport="700x320" --><html><head><meta charset="utf-8"><title>Radii & shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 12px; }
  .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { background: #fff; border: 1px solid var(--neo-cloud); width: 100%; height: 70px; }
  .item .name { font-family: var(--font-mono); font-size: 11px; color: var(--neo-steel); }
  .item .v { font-family: var(--font-mono); font-size: 10px; color: var(--neo-fog); }
  h4 { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--neo-fog); margin: 0 0 8px; }
  .shadow-box { background: #fff; width: 100%; height: 70px; border-radius: 10px; }
</style>
</head><body>
<div class="card">
  <div>
    <h4>Radius</h4>
    <div class="row">
      <div class="item"><div class="box" style="border-radius:2px"></div><div class="name">xs · 2px</div></div>
      <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">sm · 4px</div></div>
      <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">md · 6px</div><div class="v">default</div></div>
      <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">lg · 10px</div><div class="v">cards</div></div>
      <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">xl · 14px</div><div class="v">hero</div></div>
      <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div></div>
    </div>
  </div>
  <div>
    <h4>Shadow · usar com parcimônia</h4>
    <div class="row" style="background:var(--neo-paper);padding:18px;border-radius:8px">
      <div class="item"><div class="shadow-box" style="box-shadow:0 1px 0 rgba(14,17,18,0.04)"></div><div class="name">xs</div></div>
      <div class="item"><div class="shadow-box" style="box-shadow:0 1px 2px rgba(14,17,18,0.06),0 1px 1px rgba(14,17,18,0.04)"></div><div class="name">sm · inputs</div></div>
      <div class="item"><div class="shadow-box" style="box-shadow:0 4px 12px rgba(14,17,18,0.06),0 1px 2px rgba(14,17,18,0.04)"></div><div class="name">md · menus</div></div>
      <div class="item"><div class="shadow-box" style="box-shadow:0 14px 32px rgba(14,17,18,0.08),0 2px 4px rgba(14,17,18,0.04)"></div><div class="name">lg · modals</div></div>
    </div>
  </div>
</div>
</body></html>
