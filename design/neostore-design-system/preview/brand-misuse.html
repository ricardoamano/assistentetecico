<!doctype html>
<!-- @dsCard group="Brand" name="Logo misuse" subtitle="What not to do with the lockup" viewport="700x320" --><html><head><meta charset="utf-8"><title>Logo misuse</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .ex { border: 1px solid var(--neo-cloud); border-radius: 8px; overflow: hidden; }
  .ex .v { background: var(--neo-paper); height: 120px; display:flex;align-items:center;justify-content:center; padding: 12px; position: relative; }
  .ex img { max-height: 80px; max-width: 100%; }
  .ex .lab { padding: 8px 10px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .ex.bad .lab { color: #B83A3A; }
  .ex.bad .v::after {
    content: ''; position: absolute; top: 8px; right: 8px; width: 18px; height: 18px;
    background: #B83A3A; border-radius: 50%;
    background-image: linear-gradient(45deg, transparent 45%, #fff 45%, #fff 55%, transparent 55%);
  }
  .ex.good .lab { color: #2E8F5E; }
  .ex.good .v::after {
    content: '✓'; position: absolute; top: 6px; right: 8px; color: #2E8F5E; font-weight: 700;
  }
</style>
</head><body>
<div class="card">
  <div class="eyebrow">Misuse · não fazer</div>
  <div class="grid">
    <div class="ex good"><div class="v"><img src="../assets/logo-horizontal-color-transparent.png?v=5"/></div><div class="lab">Versão correta</div></div>
    <div class="ex bad"><div class="v" style="transform:none"><img src="../assets/logo-horizontal-color-transparent.png?v=5" style="transform:scaleX(0.65)"/></div><div class="lab">Esticado / distorcido</div></div>
    <div class="ex bad"><div class="v" style="background:#4A1F4F"><img src="../assets/logo-horizontal-color-transparent.png?v=5"/></div><div class="lab">Sobre fundo não-aprovado</div></div>
    <div class="ex bad"><div class="v"><img src="../assets/logo-horizontal-color-transparent.png?v=5" style="filter:hue-rotate(90deg)"/></div><div class="lab">Recolorido</div></div>
    <div class="ex bad"><div class="v"><img src="../assets/logo-horizontal-color-transparent.png?v=5" style="filter:drop-shadow(2px 4px 6px rgba(0,0,0,0.5))"/></div><div class="lab">Sombra / efeitos</div></div>
    <div class="ex bad"><div class="v"><img src="../assets/logo-horizontal-color-transparent.png?v=5" style="transform:rotate(-8deg)"/></div><div class="lab">Rotacionado</div></div>
  </div>
</div>
</body></html>
