<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Teal primary + purple accent + ink/graphite" viewport="700x360" --><html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .card { padding: 28px 32px; gap: 20px; }
  .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .swatch { border: 1px solid var(--neo-cloud); border-radius: 10px; overflow: hidden; }
  .swatch .chip { height: 76px; }
  .swatch .meta { padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .swatch .name { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  .swatch .role { font-size: 11px; color: var(--neo-fog); margin-top: 2px; }
  .swatch .hex { font-family: var(--font-mono); font-size: 12px; color: var(--neo-steel); }
  .ink-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ink-pair .swatch .chip { height: 56px; }
</style>
</head><body>
<div class="card">
  <div>
    <div class="eyebrow">Brand · primary + accent</div>
  </div>
  <div class="swatches">
    <div class="swatch">
      <div class="chip" style="background:#1F6E78"></div>
      <div class="meta">
        <div>
          <div class="name">Teal 500</div>
          <div class="role">Primary · confiança técnica</div>
        </div>
        <div class="hex">#1F6E78</div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#4A1F4F"></div>
      <div class="meta">
        <div>
          <div class="name">Purple 500</div>
          <div class="role">Accent · 1 elemento por tela</div>
        </div>
        <div class="hex">#4A1F4F</div>
      </div>
    </div>
  </div>
  <div class="ink-pair">
    <div class="swatch">
      <div class="chip" style="background:#0E1112"></div>
      <div class="meta">
        <div><div class="name">Ink</div><div class="role">Premium ground</div></div>
        <div class="hex">#0E1112</div>
      </div>
    </div>
    <div class="swatch">
      <div class="chip" style="background:#1A1F22"></div>
      <div class="meta">
        <div><div class="name">Graphite</div><div class="role">Dark surface</div></div>
        <div class="hex">#1A1F22</div>
      </div>
    </div>
  </div>
</div>
</body></html>
