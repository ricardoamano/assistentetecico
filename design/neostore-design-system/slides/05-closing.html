<!doctype html>
<!-- @dsCard group="Slides" name="Slide · closing" subtitle="CTA + contato em fundo ink" viewport="1280x720" -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Closing slide — NEOSTORE</title>
  <link rel="stylesheet" href="../colors_and_type.css"/>
  <style>
    html, body { margin: 0; background: #000; }
    .slide { width: 1280px; height: 720px; background: var(--neo-ink); color: #fff; position: relative; padding: 56px 64px; box-sizing: border-box; overflow: hidden; }
    .watermark { position: absolute; right: -60px; bottom: -60px; opacity: 0.10; }
    .watermark img { width: 720px; }
    .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
    .top img { height: 60px; }
    .top .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neo-fog); }
    .body { position: relative; margin-top: 80px; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neo-teal-300); }
    .quote { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 18px 0 48px; max-width: 920px; color: #fff; }
    .quote em { color: var(--neo-teal-300); font-style: normal; font-weight: 800; }
    .contact { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 900px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.16); }
    .contact .l { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--neo-fog); }
    .contact .v { font-size: 17px; color: #fff; margin-top: 6px; font-weight: 600; letter-spacing: -0.005em; }
    .footer { position: absolute; bottom: 28px; left: 64px; right: 64px; display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.12); font-family: var(--font-mono); font-size: 11px; color: var(--neo-fog); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="watermark"><img src="../assets/logo-vertical-color-dark.png?v=5"/></div>
    <div class="top">
      <img src="../assets/logo-horizontal-color-dark.png?v=5"/>
      <div class="meta">05 · Próximos passos</div>
    </div>
    <div class="body">
      <div class="eyebrow">Conversa técnica</div>
      <div class="quote">Tem um evento que não pode falhar?<br/><em>Mande o briefing.</em></div>
      <div class="contact">
        <div><div class="l">E-mail</div><div class="v">contato@neostore.com.br</div></div>
        <div><div class="l">Telefone</div><div class="v">+55 11 0000 0000</div></div>
        <div><div class="l">Operação</div><div class="v">São Paulo · SP</div></div>
      </div>
    </div>
    <div class="footer"><span>NEOSTORE · operação 2026</span><span>05 / 05</span></div>
  </div>
</body>
</html>
