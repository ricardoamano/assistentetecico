<!doctype html>
<!-- @dsCard group="Slides" name="Slide · stats" subtitle="4 estatísticas em fundo grafite" viewport="1280x720" -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Stats slide — NEOSTORE</title>
  <link rel="stylesheet" href="../colors_and_type.css"/>
  <style>
    html, body { margin: 0; background: #000; }
    .slide { width: 1280px; height: 720px; background: var(--neo-graphite); color: #fff; position: relative; padding: 56px 64px; box-sizing: border-box; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .top img { height: 60px; }
    .top .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neo-fog); }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neo-teal-300); margin-top: 36px; }
    h2 { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; margin: 12px 0 56px; max-width: 1000px; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; }
    .stat .n { font-size: 104px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: var(--neo-teal-300); display: block; }
    .stat .u { font-size: 18px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--neo-mist); display: block; margin-top: 10px; }
    .stat .d { font-size: 14px; color: var(--neo-mist); margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12); line-height: 1.5; }
    .footer { position: absolute; bottom: 28px; left: 64px; right: 64px; display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.12); font-family: var(--font-mono); font-size: 11px; color: var(--neo-fog); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="top">
      <img src="../assets/logo-horizontal-color-dark.png?v=5" style="opacity:.95"/>
      <div class="meta">04 · Operação em números</div>
    </div>
    <div class="eyebrow">Operação 2007 → 2026</div>
    <h2>18 anos resolvendo bastidores corporativos.</h2>
    <div class="grid">
      <div class="stat"><span class="n">18</span><span class="u">anos</span><div class="d">em operação técnica desde 2007</div></div>
      <div class="stat"><span class="n">1.4k</span><span class="u">eventos</span><div class="d">corporativos entregues</div></div>
      <div class="stat"><span class="n">32</span><span class="u">pessoas</span><div class="d">na equipe técnica fixa</div></div>
      <div class="stat"><span class="n">99.6%</span><span class="u">uptime</span><div class="d">em transmissão e operação</div></div>
    </div>
    <div class="footer"><span>NEOSTORE · operação 2026</span><span>04 / 05</span></div>
  </div>
</body>
</html>
