<!doctype html>
<!-- @dsCard group="Slides" name="Slide · section divider" subtitle="Divisor de capítulo" viewport="1280x720" -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Section divider — NEOSTORE</title>
  <link rel="stylesheet" href="../colors_and_type.css"/>
  <style>
    html, body { margin: 0; background: #000; }
    .slide { width: 1280px; height: 720px; background: #fff; color: var(--neo-ink); position: relative; overflow: hidden; padding: 64px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
    .num { font-family: var(--font-mono); font-size: 96px; font-weight: 700; color: var(--neo-teal-500); letter-spacing: -0.03em; line-height: 1; }
    .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neo-fog); margin-top: 24px; }
    h2 { font-size: 84px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; margin: 16px 0 0; }
    .lead { font-size: 20px; color: var(--neo-steel); margin-top: 24px; max-width: 720px; line-height: 1.5; }
    .rule { width: 240px; height: 4px; background: linear-gradient(to right, var(--neo-teal-500) 0 60%, var(--neo-purple-500) 60%); margin-top: 36px; border-radius: 2px; }
    .footer { position: absolute; bottom: 32px; left: 64px; right: 64px; display: flex; justify-content: space-between; padding-top: 18px; border-top: 1px solid var(--neo-cloud); font-family: var(--font-mono); font-size: 11px; color: var(--neo-fog); }
    .top-logo { position: absolute; top: 40px; right: 64px; height: 60px; }
  </style>
</head>
<body>
  <div class="slide">
    <img class="top-logo" src="../assets/logo-horizontal-color-transparent.png?v=5"/>
    <div class="num">02</div>
    <div class="eyebrow">Capítulo</div>
    <h2>Como a operação<br/>se organiza.</h2>
    <p class="lead">Briefing, pré-produção, ensaio técnico, execução em campo e desmontagem. Cinco etapas, um único ritmo.</p>
    <div class="rule"></div>
    <div class="footer"><span>NEOSTORE · operação 2026</span><span>02 / 05</span></div>
  </div>
</body>
</html>
