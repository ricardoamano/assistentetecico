<!doctype html>
<!-- @dsCard group="Slides" name="Slide · title" subtitle="Apresentação institucional · capa" viewport="1280x720" -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Title slide — NEOSTORE</title>
  <link rel="stylesheet" href="../colors_and_type.css"/>
  <style>
    html, body { margin: 0; background: #000; }
    .slide { width: 1280px; height: 720px; background: var(--neo-ink); color: #fff; position: relative; overflow: hidden; }
    .watermark { position: absolute; right: -80px; bottom: -80px; opacity: 0.08; }
    .watermark img { width: 560px; }
    .top { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; }
    .top img { height: 60px; }
    .top .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neo-fog); }
    .body { position: absolute; bottom: 80px; left: 64px; right: 64px; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neo-teal-300); }
    h1 { font-size: 96px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; margin: 16px 0 0; max-width: 1000px; }
    .lead { font-size: 22px; color: var(--neo-mist); margin-top: 28px; max-width: 720px; line-height: 1.45; }
    .footer { position: absolute; bottom: 32px; left: 64px; right: 64px; display: flex; justify-content: space-between; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.12); font-family: var(--font-mono); font-size: 11px; color: var(--neo-fog); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="watermark"><img src="../assets/logo-vertical-color-dark.png?v=5"/></div>
    <div class="top">
      <img src="../assets/logo-horizontal-color-dark.png?v=5"/>
      <div class="meta">Apresentação institucional · 2026</div>
    </div>
    <div class="body">
      <div class="eyebrow">Tecnologia para eventos</div>
      <h1>Eventos que não podem falhar começam no bastidor.</h1>
      <p class="lead">Áudio, vídeo, iluminação e operação confiável para convenções, congressos e ativações corporativas. Em São Paulo, desde 2007.</p>
    </div>
    <div class="footer"><span>NEOSTORE · operação 2026</span><span>01 / 05</span></div>
  </div>
</body>
</html>
